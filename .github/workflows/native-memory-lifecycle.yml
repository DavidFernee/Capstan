name: Native memory lifecycle model

on:
  push:
    branches:
      - research/native-compiler-bootstrap
    paths:
      - "verification/lean/NativeMemoryLifecycle.lean"
      - ".github/workflows/native-memory-lifecycle.yml"
  pull_request:
    paths:
      - "verification/lean/NativeMemoryLifecycle.lean"
      - ".github/workflows/native-memory-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-memory-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle-model:
    name: Build bounded handle lifecycle model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: verification/lean
          build: true
          build-args: --wfail
          test: false
          lint: false
          leanchecker: false
          nanoda: false
      - name: Reject unfinished proofs and local axioms
        working-directory: verification/lean
        shell: bash
        run: |
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)|^[[:space:]]*axiom[[:space:]]' NativeMemoryLifecycle.lean; then
            echo "Unfinished proof or local axiom declaration found."
            exit 1
          fi
      - name: Compile standalone lifecycle model
        working-directory: verification/lean
        run: lake env lean -o NativeMemoryLifecycle.olean NativeMemoryLifecycle.lean
      - name: Audit theorem axiom dependencies
        working-directory: verification/lean
        shell: bash
        run: |
          cat > NativeMemoryLifecycleAxiomAudit.lean <<'EOF'
          import NativeMemoryLifecycle
          open CapstanNativeMemory
          #print axioms allocateSlot_success_resolves
          #print axioms allocateSlot_rejects_occupied
          #print axioms allocateSlot_rejects_retired
          #print axioms releaseSlot_rejects_stale
          #print axioms releaseSlot_retires_at_maximum
          #print axioms releaseSlot_advances_generation
          #print axioms resolveSlot_rejects_free_generation
          #print axioms resolveHandle_rejects_cross_domain
          #print axioms allocateAt_rejection_is_atomic
          #print axioms releaseAt_rejection_is_atomic
          #print axioms updateSlot_preserves_other
          #print axioms reuse_rejects_previous_incarnation
          EOF
          lake env lean NativeMemoryLifecycleAxiomAudit.lean | tee "$RUNNER_TEMP/native-memory-axioms.txt"
          if grep -q 'sorryAx' "$RUNNER_TEMP/native-memory-axioms.txt"; then
            echo "Unexpected sorryAx dependency."
            exit 1
          fi
