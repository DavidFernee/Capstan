name: Native memory lifecycle model

on:
  push:
    branches:
      - research/native-compiler-bootstrap
    paths:
      - "verification/lean/NativeMemoryLifecycle.lean"
      - ".github/workflows/native-memory-lifecycle.yml"
  pull_request:
    paths:
      - "verification/lean/NativeMemoryLifecycle.lean"
      - ".github/workflows/native-memory-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-memory-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle-model:
    name: Build bounded handle lifecycle model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: verification/lean
          build: true
          build-args: --wfail
          test: false
          lint: false
          leanchecker: false
          nanoda: false
      - name: Check standalone lifecycle model with warnings as errors
        working-directory: verification/lean
        run: lake env lean NativeMemoryLifecycle.lean --wfail
