name: native systematic assurance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  systematic:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        group: [scalar, memory, security, native, mutation, generative, ecosystem, presentation]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Record revision and bootstrap compiler
        run: |
          git rev-parse HEAD 'HEAD^{tree}'
          make bootstrap
      - name: Test evidence runner
        run: python3 tools/assurance/test_systematic_runner.py
      - name: Execute all suites in selected group
        env:
          ASSURANCE_GROUP: ${{ matrix.group }}
        run: python3 tools/assurance/systematic_runner.py "$ASSURANCE_GROUP"
      - name: Preserve group evidence and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: systematic-${{ matrix.group }}
          path: build/systematic-evidence/${{ matrix.group }}/
          if-no-files-found: error
