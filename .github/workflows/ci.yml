name: ci
on:
  # Pushes are tested only on main; a branch is tested through its pull request, so one push
  # starts one run, not two. Other branches can be tested on demand (workflow_dispatch).
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 15 * * *"      # nightly full run (01:17 Melbourne time)
  workflow_dispatch:
permissions:
  contents: read
# A newer commit on a pull request cancels the run for the older one, so a burst of small
# commits does not queue a run per commit ahead of the one that matters. Runs on main are
# never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc }
          - { os: ubuntu-latest, cc: clang }
          - { os: macos-latest,  cc: clang }
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      EVENT: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap (stage 0 -> self-hosted fixpoint)
        run: make
      - name: Test suite
        run: |
          if [ "${EVENT}" = "schedule" ]; then tests/run.sh --full; else tests/run.sh; fi
      - name: Keep fuzz failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures-${{ matrix.os }}-${{ matrix.cc }}
          path: |
            tests/fuzz/failures/
            tests/fmt/failures/
          if-no-files-found: ignore

  # The release pipeline's evidence, checked on every change: the workflows lint clean, and the
  # SBOMs of the current tree are valid against the official CycloneDX and SPDX schemas.
  # (tests/run.sh already checks SBOM generation, reproducibility reports and the verifier.)
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Lint the workflows (actionlint, with shellcheck on every run step)
        # The release binary, pinned by its SHA-256 (from the release's checksums file).
        env:
          ACTIONLINT: actionlint_1.7.12_linux_amd64.tar.gz
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          cd "${RUNNER_TEMP}"
          curl -sSfL --retry 3 -o "${ACTIONLINT}" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/${ACTIONLINT}"
          echo "${ACTIONLINT_SHA256}  ${ACTIONLINT}" | sha256sum -c -
          tar -xzf "${ACTIONLINT}" actionlint
          cd "${GITHUB_WORKSPACE}" && "${RUNNER_TEMP}/actionlint" -color
      - name: SBOM of the current tree, validated against the schemas
        run: |
          ver="$(sed -n 's/^const string VERSION = "\(.*\)";/\1/p' compiler/main.cap)"
          out="${RUNNER_TEMP}/sbom"; mkdir -p "${out}"
          git archive --format=tar.gz --prefix="capstan-${ver}/" -o "${out}/capstan-${ver}.tar.gz" HEAD
          python3 -I scripts/sbom.py generate --archive "${out}/capstan-${ver}.tar.gz" --commit "$(git rev-parse HEAD)" \
            --cyclonedx "${out}/capstan.cdx.json" --spdx "${out}/capstan.spdx.json"
          python3 -m venv "${RUNNER_TEMP}/sbom-venv"
          "${RUNNER_TEMP}/sbom-venv/bin/pip" install --quiet --require-hashes --only-binary :all: -r scripts/sbom-schema-requirements.txt
          "${RUNNER_TEMP}/sbom-venv/bin/python" -I scripts/sbom-validate.py \
            --cyclonedx "${out}/capstan.cdx.json" --spdx "${out}/capstan.spdx.json"
      - name: Validate machine-readable assurance claims
        run: |
          "${RUNNER_TEMP}/sbom-venv/bin/python" -I scripts/assurance-validate.py --require-fresh
      - name: Test assurance freshness and promotion policy
        run: python3 -I tests/unit/assurance_freshness.py
      - name: Validate CWE per-attempt evidence records
        run: |
          "${RUNNER_TEMP}/sbom-venv/bin/python" -I tests/cwe/attempt_records.py --check
