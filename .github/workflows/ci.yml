name: ci
on: [push, pull_request]
jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [gcc, clang]
        exclude:
          - os: macos-latest
            cc: gcc
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap (stage 0 -> self-hosted fixpoint)
        run: make
      - name: Test suite
        run: tests/run.sh
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make
      - name: Compiler and examples under ASan + UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          SAN="-O1 -g -std=gnu11 -w -fsanitize=address,undefined -fno-sanitize-recover=all -Iruntime"
          gcc $SAN build/stage3.c -o san-capstanc
          ./san-capstanc build -o self.c compiler/{ast,lexer,parser,checker,codegen,main}.cap
          cmp self.c build/stage3.c
          for f in tests/accept/*.cap examples/*.cap; do
            ./build/capstanc build -o x.c "$f" && gcc $SAN x.c -o x && ./x > /dev/null
          done
